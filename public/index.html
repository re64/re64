<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>re64</title>
    <style>
      :root {
        --bg: #14161b;
        --panel: #1b1e26;
        --border: #2a2f3a;
        --fg: #c8cdd8;
        --dim: #6b7386;
        --accent: #7cc4ff;
        --accent-dim: #3d5a75;
        --label: #9ae08a;
        --xref: #d2a05a;
        --illegal: #e06c75;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #app { display: flex; flex-direction: column; height: 100%; }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }

      .brand {
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--accent);
        margin-right: 4px;
      }

      .tabs { display: flex; gap: 2px; }

      .tab {
        padding: 4px 12px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: none;
        color: var(--dim);
        cursor: pointer;
        font: inherit;
      }
      .tab:hover { color: var(--fg); }
      .tab.active {
        color: var(--fg);
        background: var(--bg);
        border-color: var(--border);
      }

      .spacer { flex: 1; }

      button, input {
        font: inherit;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 10px;
      }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent-dim); }
      button:disabled { opacity: 0.4; cursor: default; }

      #goto { width: 90px; font-family: 'SF Mono', Menlo, Consolas, monospace; }

      #status { color: var(--dim); font-size: 12px; min-width: 200px; }
      #status.error { color: var(--illegal); }

      main { flex: 1; min-height: 0; position: relative; }
      #disasm, #project { position: absolute; inset: 0; }

      footer {
        flex: 0 0 auto;
        padding: 5px 12px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        color: var(--dim);
        font-size: 12px;
        display: flex;
        gap: 16px;
      }

      kbd {
        font-family: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 4px;
      }

      /* Disassembly token styling */
      .tok-addr { color: var(--dim); }
      .tok-mnemonic { color: var(--fg); font-weight: 600; }
      .tok-mnemonic.illegal { color: var(--illegal); }
      .tok-operand {
        color: var(--accent);
        cursor: pointer;
        border-bottom: 1px dotted var(--accent-dim);
      }
      .tok-operand:hover { background: var(--accent-dim); color: #fff; }
      /* Named but unloaded — zero page, I/O registers, KERNAL entry points. */
      .tok-operand-offmap { color: #7f8ba0; }
      .tok-label { color: var(--label); font-weight: 600; cursor: pointer; }
      .tok-label:hover { text-decoration: underline; }
      .tok-xref { color: var(--xref); cursor: pointer; }
      .tok-xref:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="brand">re64</span>
        <div class="tabs">
          <button class="tab active" data-tab="disasm">Disassembly</button>
          <button class="tab" data-tab="project">Project</button>
        </div>
        <button id="back">← Back</button>
        <input id="goto" placeholder="$8000" spellcheck="false" />
        <button id="reload">Reload</button>
        <button id="save">Save project</button>
        <span class="spacer"></span>
        <span id="status"></span>
      </header>
      <main>
        <div id="disasm"></div>
        <div id="project" style="display: none"></div>
      </main>
      <footer>
        <span id="stats"></span>
        <span class="spacer"></span>
        <span>
          <kbd>click</kbd> operand to jump ·
          <kbd>click</kbd> label to rename ·
          <kbd>n</kbd> name here ·
          <kbd>Enter</kbd> follow / commit ·
          <kbd>Esc</kbd> cancel ·
          <kbd>Backspace</kbd> back
        </span>
      </footer>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
